[package]
name = "ritarena"
version = "0.1.0"
description = "RitArena — AI Agent Battle Arena on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ritarena"

[features]
default = []
init-if-needed = ["anchor-lang/init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"

[dev-dependencies]
litesvm = "0.11.0"
solana-message = "3.1.0"
solana-transaction = "3.1.0"
solana-signer = "3.0.0"
solana-keypair = "3.1.2"
solana-pubkey = "3.0.0"
solana-instruction = "3.4.0"
solana-hash = "3.1.0"
solana-sha256-hasher = "3.1.0"
solana-signature = "3.0.0"
solana-program-pack = "3.1.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
