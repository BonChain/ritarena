<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RitArena Snake Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #14F195;
      letter-spacing: 0.05em;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
    }

    #mode-badge {
      color: #a78bfa;
      border-color: #a78bfa;
    }

    #status-badge {
      color: #ef4444;
      border-color: #ef4444;
    }

    /* Main layout */
    main {
      display: flex;
      flex: 1;
      padding: 24px;
      gap: 24px;
      align-items: flex-start;
    }

    /* Canvas */
    canvas#game {
      display: block;
      background: #111;
      border: 1px solid #333;
      flex-shrink: 0;
    }

    /* Sidebar */
    aside {
      border-left: 1px solid #333;
      padding-left: 24px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #round-info {
      font-size: 0.85rem;
      color: #a0a0a0;
    }

    #round-info strong {
      color: #e0e0e0;
    }

    aside h2 {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #14F195;
      margin-bottom: 8px;
    }

    #scoreboard {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #scoreboard li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    #scoreboard li.dead {
      opacity: 0.4;
      text-decoration: line-through;
    }

    #scoreboard .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #scoreboard .snake-name {
      flex: 1;
      color: #c0c0c0;
    }

    #scoreboard .snake-score {
      color: #14F195;
      font-weight: 700;
    }

    /* Log panel */
    #log-section {
      padding: 0 24px 24px;
    }

    #log-section h2 {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #14F195;
      margin-bottom: 8px;
    }

    #log-panel {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px 12px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .log-entry {
      color: #888;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-entry + .log-entry {
      margin-top: 2px;
    }

    /* Winner overlay */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #winner-overlay.show {
      display: flex;
    }

    #winner-box {
      background: #111;
      border: 2px solid #14F195;
      border-radius: 8px;
      padding: 40px 60px;
      text-align: center;
    }

    #winner-box p {
      font-size: 0.8rem;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #winner-name {
      font-size: 2rem;
      font-weight: 700;
      color: #14F195;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .controls select, .controls button {
      font-family: inherit;
      font-size: 0.75rem;
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .controls button:hover:not(:disabled) {
      border-color: #14F195;
      color: #14F195;
    }

    .controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .speed-controls {
      display: flex;
      gap: 2px;
    }

    .speed-btn {
      min-width: 32px;
      text-align: center;
    }

    .speed-btn.active {
      background: #14F195;
      color: #0a0a0a;
      border-color: #14F195;
      font-weight: 700;
    }

    /* Phase chip */
    #phase-chip {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #888;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Preflight panel */
    #preflight-panel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 10, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    #preflight-panel h2 {
      color: #14F195;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    #preflight-list {
      list-style: none;
      min-width: 300px;
    }

    #preflight-list li {
      padding: 4px 0;
      font-size: 0.8rem;
      display: flex;
      gap: 8px;
    }

    #preflight-list .check-icon { width: 20px; text-align: center; }
    #preflight-list .check-ok { color: #14F195; }
    #preflight-list .check-fail { color: #ef4444; }
    #preflight-list .check-pending { color: #888; }

    #preflight-msg {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #888;
    }

    #btn-retry {
      margin-top: 8px;
      font-family: inherit;
      font-size: 0.75rem;
      background: #1a1a2e;
      color: #14F195;
      border: 1px solid #14F195;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
    }

    /* Arena info */
    #arena-info-section h2 {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #14F195;
      margin-bottom: 8px;
    }

    #arena-info {
      font-size: 0.75rem;
      color: #a0a0a0;
      line-height: 1.8;
    }

    #arena-info span {
      color: #e0e0e0;
    }

    #arena-info a {
      color: #14F195;
      text-decoration: none;
    }

    #arena-info a:hover {
      text-decoration: underline;
    }

    /* Log tag colors */
    .log-tag {
      font-weight: 700;
      margin-right: 4px;
    }

    .log-tag-create { color: #a78bfa; }
    .log-tag-register { color: #60a5fa; }
    .log-tag-enter { color: #34d399; }
    .log-tag-start { color: #14F195; }
    .log-tag-eliminate { color: #f87171; }
    .log-tag-finalize { color: #fbbf24; }
    .log-tag-info { color: #888; }

    /* Log flash animation */
    @keyframes log-flash {
      0% { background: rgba(20, 241, 149, 0.15); }
      100% { background: transparent; }
    }

    .log-entry.flash {
      animation: log-flash 0.5s ease-out;
    }

    /* Log explorer link */
    .log-explorer {
      color: #14F195;
      text-decoration: none;
      margin-left: 6px;
      font-size: 0.65rem;
    }

    .log-explorer:hover {
      text-decoration: underline;
    }

    /* Play again button */
    #btn-play-again {
      margin-top: 20px;
      font-family: inherit;
      font-size: 0.85rem;
      background: transparent;
      color: #14F195;
      border: 1px solid #14F195;
      border-radius: 4px;
      padding: 8px 24px;
      cursor: pointer;
    }

    #btn-play-again:hover {
      background: #14F195;
      color: #0a0a0a;
    }

    /* Canvas wrapper needs relative positioning for preflight overlay */
    .canvas-wrap {
      position: relative;
    }
  </style>
</head>
<body>

  <header>
    <h1>RitArena Snake Game</h1>
    <span class="badge" id="mode-badge">MOCK</span>
    <span class="badge" id="status-badge">CONNECTING...</span>
    <div class="controls">
      <select id="mode-select">
        <option value="mock">Mock</option>
        <option value="devnet">Devnet</option>
      </select>
      <button id="btn-start">Start Game</button>
      <button id="btn-restart" disabled>Restart</button>
      <span class="speed-controls">
        <button class="speed-btn active" id="speed-1x">1x</button>
        <button class="speed-btn" id="speed-2x">2x</button>
        <button class="speed-btn" id="speed-5x">5x</button>
      </span>
      <span class="badge" id="phase-chip">LOBBY</span>
    </div>
  </header>

  <main>
    <div class="canvas-wrap">
      <canvas id="game" width="800" height="800"></canvas>
      <div id="preflight-panel" style="display:none">
        <h2>Devnet Preflight Checks</h2>
        <ul id="preflight-list"></ul>
        <p id="preflight-msg"></p>
        <button id="btn-retry" style="display:none">Retry</button>
      </div>
    </div>

    <aside>
      <div id="round-info">
        Round <strong><span id="round-num">—</span></strong>
        &nbsp;—&nbsp;
        <span id="round-timer">—</span>s left
      </div>

      <div>
        <h2>Scoreboard</h2>
        <ul id="scoreboard"></ul>
      </div>

      <div id="arena-info-section" style="display:none">
        <h2>Arena Info</h2>
        <div id="arena-info">
          <div>Arena ID: <span id="arena-id">—</span></div>
          <div>State: <span id="arena-state">—</span></div>
          <div>Entry Fee: <span id="arena-fee">—</span></div>
          <div>Prize Pool: <span id="arena-pool">—</span></div>
          <div>Prize Split: <span id="arena-split">—</span></div>
          <div>Mode: <span id="arena-mode">—</span></div>
          <div id="arena-address-row" style="display:none">Address: <span id="arena-address">—</span></div>
        </div>
      </div>
    </aside>
  </main>

  <section id="log-section">
    <h2>RitArena SDK Log</h2>
    <div id="log-panel"></div>
  </section>

  <div id="winner-overlay">
    <div id="winner-box">
      <p>Winner</p>
      <h2 id="winner-name"></h2>
      <button id="btn-play-again">Play Again</button>
    </div>
  </div>

  <script src="/renderer.js"></script>
</body>
</html>
